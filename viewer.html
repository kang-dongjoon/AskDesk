<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask — Desk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-view" style="background:#000; overflow:hidden;">

  <div id="loading">loading…</div>

  <nav id="viewer-nav">
    <a href="index.html" class="nav-btn nav-btn-dark">Home</a>
    <button id="btn-ask" class="nav-btn nav-btn-dark">Ask</button>
  </nav>

  <aside id="viewer-panel">
    <div id="panel-desk-info"></div>
    <div id="panel-objects"></div>
    <div id="panel-edit-row">
      <button class="nav-btn" id="btn-edit" style="display:none;">Edit</button>
    </div>
  </aside>

  <div id="viewer-edit-modal">
    <div id="viewer-edit-dialog">
      <button id="btn-viewer-edit-close" type="button">×</button>
      <h2>Edit</h2>
      <p>편집을 위한 비밀번호<br>4자리를 입력해주세요.</p>
      <input id="viewer-edit-pin" class="pin-entry" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="0000">
      <div id="viewer-edit-error"></div>
      <div class="viewer-edit-actions">
        <button class="nav-btn" id="btn-edit-points" type="button">내용만 수정</button>
        <button class="nav-btn" id="btn-edit-full" type="button">시점부터 수정</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/config.js"></script>
  <script src="js/cms.js"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
