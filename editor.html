<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask — Desk · upload</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #111; overflow: hidden; }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    /* ── Nav ── */
    #editor-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 24px;
      pointer-events: all;
      z-index: 10;
    }

    .nav-btn-editor {
      display: inline-block;
      border: 1px solid rgba(255,255,255,0.6);
      padding: 5px 14px;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: .06em;
      cursor: pointer;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-family: inherit;
      transition: opacity 150ms;
    }
    .nav-btn-editor:hover { opacity: .5; }

    #step-indicator {
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      pointer-events: none;
    }

    /* ── Upload screen ── */
    #step-upload {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: all;
      background: #fff;
    }

    #step-upload h2 {
      font-size: clamp(40px, 7vw, 88px);
      font-weight: 300;
      letter-spacing: -.01em;
      line-height: 1;
      margin-bottom: 20px;
    }

    #step-upload .sub {
      font-size: 11px;
      letter-spacing: .06em;
      color: #888;
      line-height: 1.8;
      text-align: center;
      margin-bottom: 40px;
    }

    #upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #file-input { display: none; }

    #upload-progress {
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #bbb;
      display: none;
      margin-top: 4px;
    }

    /* ── Buttons ── */
    .btn {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: #111;
      border: 1px solid #111;
      padding: 9px 24px;
      cursor: pointer;
      background: #fff;
      transition: opacity 150ms;
      white-space: nowrap;
    }
    .btn:hover { opacity: .5; }
    .btn:disabled { opacity: .3; cursor: default; }

    .btn-ghost {
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 9px 24px;
      cursor: pointer;
      background: transparent;
      transition: opacity 150ms;
      white-space: nowrap;
    }
    .btn-ghost:hover { opacity: .6; }

    #login-status {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #login-name {
      font-size: 10px;
      letter-spacing: .08em;
      color: #bbb;
    }

    /* ── Bottom bar (step 2, 3, submit) ── */
    .bottom-bar {
      display: none;
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      flex-direction: column;
      align-items: center;
      gap: 14px;
      pointer-events: all;
    }
    .bottom-bar p {
      font-size: 10px;
      letter-spacing: .08em;
      color: rgba(255,255,255,0.4);
      text-align: center;
      line-height: 1.8;
    }

    /* ── Crosshair ── */
    #crosshair {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 16px; height: 16px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.6);
    }
    #crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
    #crosshair::after  { width: 100%; height: 1px; top: 50%; left: 0; }

    /* ── Meta form ── */
    #meta-form {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid #e0e0e0;
      padding: 28px;
      width: 300px;
      pointer-events: all;
    }

    #meta-form h3 {
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #bbb;
      margin-bottom: 7px;
    }

    .field input, .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #e8e8e8;
      font: inherit;
      font-size: 12px;
      font-weight: 300;
      padding: 4px 0;
      outline: none;
      background: transparent;
      color: #111;
    }
    .field input:focus, .field textarea:focus {
      border-bottom-color: #111;
    }
    .field textarea { resize: none; height: 68px; line-height: 1.6; }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 22px;
    }
    .form-actions .btn { flex: 1; text-align: center; }
  </style>
</head>
<body>

<div id="ui">
  <nav id="editor-nav">
    <a href="index.html" class="nav-btn-editor" id="btn-back">Back</a>
    <span id="step-indicator"></span>
    <button class="nav-btn-editor" id="btn-done" style="display:none;">Done</button>
  </nav>

  <!-- Step 1: Upload -->
  <div id="step-upload">
    <h2>Ask — Desk</h2>
    <p class="sub">당신의 책상을 업로드하세요.<br>3D 스캔 파일 (GLB) 이 필요합니다.</p>
    <div id="upload-area">
      <button class="btn" id="btn-google-login">Google로 로그인</button>
      <div id="login-status">
        <span id="login-name"></span>
        <button id="btn-select-file" class="btn">GLB 파일 선택</button>
      </div>
      <input type="file" id="file-input" accept=".glb">
      <div id="upload-progress">업로드 중…</div>
    </div>
  </div>

  <!-- Step 2: Viewpoint -->
  <div class="bottom-bar" id="step-viewpoint">
    <p>드래그로 시점을 잡고 저장하세요.</p>
    <button class="btn-ghost" id="btn-save-viewpoint">시점 저장</button>
  </div>

  <!-- Step 3: Points -->
  <div class="bottom-bar" id="step-points">
    <p>사물을 클릭해 포인트를 지정하세요.</p>
    <button class="btn-ghost" id="btn-done-points">완료 · 제출하기</button>
  </div>

  <!-- Metadata form -->
  <div id="meta-form">
    <h3>사물 정보</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="f-name" placeholder="아날로그 시계">
    </div>
    <div class="field">
      <label>수집일</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>기억 메모</label>
      <textarea id="f-memo" placeholder="이 사물에서 떠오르는 기억…"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-meta-cancel">취소</button>
      <button class="btn" id="btn-meta-save">저장</button>
    </div>
  </div>

  <!-- Step submit -->
  <div class="bottom-bar" id="step-submit">
    <p id="submit-status">편집 비밀번호 4자리를 설정하세요.</p>
    <input id="pin-input" type="number" maxlength="4" placeholder="0000"
      style="width:80px;text-align:center;border:1px solid rgba(255,255,255,0.4);
             background:transparent;color:#fff;font:inherit;font-size:18px;
             padding:6px;letter-spacing:.2em;outline:none;">
    <button class="btn-ghost" id="btn-submit">제출</button>
  </div>

  <div id="crosshair"></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/cms.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
