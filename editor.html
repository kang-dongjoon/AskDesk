<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask — Desk</title>
  <link rel="icon" type="image/png" href="icon.png?v=20260615-2">
  <link rel="stylesheet" href="css/style.css?v=20260615-20">
  <style>
    body { background: #111; overflow: hidden; color: #111; }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    #ui:has(#step-upload[style*="flex"])::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.42);
      pointer-events: none;
    }

    /* ── Nav ── */
    #editor-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      padding: 18px 24px;
      pointer-events: all;
      z-index: 10;
    }

    .nav-btn-editor {
      display: inline-block;
      border: 1px solid #111;
      padding: 10px 22px;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: .06em;
      cursor: pointer;
      background: #fff;
      color: #111;
      font-family: inherit;
      transition: opacity 150ms;
    }
    .nav-btn-editor:hover { opacity: .5; }

    #step-indicator {
      display: inline-block;
      justify-self: end;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #111;
      background: #fff;
      border: 1px solid #111;
      padding: 10px 18px;
      pointer-events: none;
    }

    #step-indicator:empty {
      visibility: hidden;
    }

    /* ── Upload screen ── */
    #step-upload {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(420px, calc(100vw - 40px));
      min-height: 300px;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      pointer-events: all;
      background: #fff;
      border: 1px solid #111;
      padding: 38px 34px;
      box-shadow: 0 28px 80px rgba(0,0,0,0.42);
      z-index: 2;
    }

    #step-upload h2 {
      font-size: 44px;
      font-weight: 300;
      letter-spacing: 0;
      line-height: 1;
      margin-bottom: 18px;
      text-align: center;
    }

    #step-upload .sub {
      font-size: 13px;
      letter-spacing: .06em;
      color: #111;
      line-height: 1.8;
      text-align: center;
      margin-bottom: 30px;
    }

    #upload-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    #file-input { display: none; }

    #upload-progress {
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #111;
      display: none;
      margin-top: 4px;
    }

    .pin-entry {
      width: 96px;
      text-align: center;
      border: 1px solid #111;
      background: transparent;
      color: #111;
      font: inherit;
      font-size: 18px;
      padding: 8px;
      letter-spacing: .2em;
      outline: none;
    }

    /* ── Buttons ── */
    .btn {
      font-size: 13px;
      letter-spacing: .06em;
      color: #111;
      border: 1px solid #111;
      padding: 10px 22px;
      cursor: pointer;
      background: #fff;
      transition: opacity 150ms;
      white-space: nowrap;
    }
    .btn:hover { opacity: .5; }
    .btn:disabled { opacity: .3; cursor: default; }

    .btn-ghost {
      font-size: 13px;
      letter-spacing: .06em;
      color: #111;
      border: 1px solid #111;
      padding: 10px 22px;
      cursor: pointer;
      background: #fff;
      transition: opacity 150ms;
      white-space: nowrap;
    }
    .btn-ghost:hover { opacity: .6; }

    #login-status {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    #login-name {
      font-size: 12px;
      letter-spacing: .08em;
      color: #111;
    }

    .upload-choice-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: min(360px, calc(100vw - 80px));
    }

    .upload-choice-row .btn {
      width: 100%;
      text-align: center;
    }

    /* ── Bottom bar (step 2, 3, submit) ── */
    .bottom-bar {
      display: none;
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      align-items: center;
      justify-content: center;
      gap: 18px;
      max-width: calc(100vw - 48px);
      background: #fff;
      border: 1px solid #111;
      padding: 10px 14px 10px 18px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: all;
    }
    .bottom-bar p {
      letter-spacing: .08em;
      color: #111;
      text-align: center;
      line-height: 1.5;
    }

    .bottom-bar.status-only {
      gap: 0;
      padding-inline: 18px;
    }

    .bottom-bar.status-only > :not(p) {
      display: none !important;
    }

    .thumbnail-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      pointer-events: all;
    }

    .bottom-bar .btn-ghost {
      border: 0;
      border-left: 1px solid #111;
      padding: 0 0 0 14px;
      font-size: 13px;
      font-weight: 300;
    }

    .bottom-bar .btn-ghost:hover {
      opacity: 1;
      font-weight: 400;
    }

    #pin-input {
      width: 70px;
      border: 0;
      border-left: 1px solid #111;
      background: #fff;
      color: #111;
      font: inherit;
      font-size: 13px;
      padding: 0 0 0 14px;
      letter-spacing: .2em;
      text-align: center;
      outline: none;
    }

    /* ── Crosshair ── */
    #crosshair {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 16px; height: 16px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content: ''; position: absolute; background: rgba(255,255,255,0.6);
    }
    #crosshair::before { width: 1px; height: 100%; left: 50%; top: 0; }
    #crosshair::after  { width: 100%; height: 1px; top: 50%; left: 0; }

    /* ── Meta form ── */
    #meta-form {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 1px solid #111;
      padding: 28px;
      width: 300px;
      pointer-events: all;
    }

    #meta-form h3 {
      font-size: 13px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 20px;
    }

    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #111;
      margin-bottom: 7px;
    }

    .field input, .field textarea {
      width: 100%;
      border: none;
      border-bottom: 1px solid #111;
      font: inherit;
      font-size: 14px;
      font-weight: 300;
      padding: 4px 0;
      outline: none;
      background: transparent;
      color: #111;
    }
    .field input:focus, .field textarea:focus {
      border-bottom-color: #111;
    }
    .field textarea { resize: none; height: 68px; line-height: 1.6; }

    .date-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 112px;
      gap: 18px;
      align-items: center;
    }

    .date-row #f-date {
      min-width: 0;
      font-size: 13px;
    }

    .unknown-check {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 0;
      text-transform: none;
      color: #111;
      white-space: nowrap;
    }

    .unknown-check input {
      flex: 0 0 16px;
      width: 16px;
      height: 16px;
      margin: 0;
      padding: 0;
      border: 0;
      accent-color: #111;
    }

    .form-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 18px;
      margin-top: 22px;
      border: 1px solid #111;
      padding: 10px 14px;
    }
    .form-actions .btn {
      border: 0;
      border-left: 1px solid #111;
      padding: 0 0 0 14px;
      font-weight: 300;
      text-align: center;
    }
    .form-actions .btn:first-child { border-left: 0; }
    .form-actions .btn:hover {
      opacity: 1;
      font-weight: 400;
    }
  </style>
</head>
<body class="app-view">

<div id="ui">
  <!-- UX-09~14: 모든 등록 단계에서 유지되는 공통 내비게이션 -->
  <nav id="editor-nav">
    <button class="nav-btn-editor" id="btn-back" type="button">뒤로</button>
    <span></span>
    <span id="step-indicator"></span>
  </nav>

  <!-- UX-09: 새 책상 업로드 또는 기존 책상 책상 식별 번호 불러오기 -->
  <div id="step-upload">
    <h2>Ask — Desk</h2>
    <p class="sub">당신의 책상을 업로드하세요.<br>3D 스캔 파일 (GLB/GLTF) 이 필요합니다.</p>
    <div id="upload-area">
      <button class="btn" id="btn-google-login">Google로 로그인</button>
      <div id="login-status">
        <span id="login-name"></span>
        <div class="upload-choice-row">
          <button id="btn-select-file" class="btn">GLB/GLTF 파일 선택</button>
          <a class="btn" href="https://poly.cam/" target="_blank" rel="noopener">Polycam 공식 사이트</a>
        </div>
      </div>
      <input type="file" id="file-input" accept=".glb,.gltf,model/gltf-binary,model/gltf+json">
      <div id="upload-progress"></div>
    </div>
  </div>

  <!-- UX-10: 새 시점 설정 또는 기존 시점 재설정 -->
  <div class="bottom-bar" id="step-viewpoint">
    <p>드래그로 시점을 정하세요.</p>
    <button class="btn-ghost" id="btn-save-viewpoint">저장</button>
  </div>

  <!-- UX-11: 새 기록 설정 또는 기존 기록 수정 -->
  <div class="bottom-bar" id="step-points">
    <p>사물을 클릭해 기록을 작성하세요.</p>
    <button class="btn-ghost" id="btn-done-points">완료</button>
  </div>

  <!-- UX-13: 새 표지 설정 또는 기존 표지 수정 -->
  <div class="bottom-bar" id="step-thumbnail">
    <p>책상의 표지를 정하세요.</p>
    <div class="thumbnail-actions">
      <button class="btn-ghost" id="btn-save-thumbnail">저장</button>
      <button class="btn-ghost" id="btn-keep-thumbnail">기존 표지 유지</button>
    </div>
  </div>

  <!-- UX-12: 기록 메타데이터 입력 폼 -->
  <div id="meta-form">
    <h3>사물 정보</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="f-name" placeholder="아날로그 시계">
    </div>
    <div class="field">
      <label>수집일</label>
      <div class="date-row">
        <input type="month" id="f-date">
        <label class="unknown-check"><input type="checkbox" id="f-date-unknown">알 수 없음</label>
      </div>
    </div>
    <div class="field">
      <label>메모</label>
      <textarea id="f-memo" placeholder="이 사물에서 떠오르는 기억…"></textarea>
    </div>
    <div class="form-actions">
      <button class="btn" id="btn-meta-cancel">취소</button>
      <button class="btn" id="btn-meta-delete" style="display:none;">삭제</button>
      <button class="btn" id="btn-meta-save">저장</button>
    </div>
  </div>

  <!-- UX-14: 새 책상 및 표지 수정의 최종 저장 -->
  <div class="bottom-bar" id="step-submit">
    <p id="submit-status">책상 식별 번호 4자리를 설정해주세요.</p>
    <input id="pin-input" type="password" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="0000">
    <button class="btn-ghost" id="btn-submit">저장</button>
  </div>

  <div id="crosshair"></div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js?v=20260614-3"></script>
<script src="js/cms.js?v=20260615-4"></script>
  <script src="js/editor.js?v=20260615-15"></script>
</body>
</html>
