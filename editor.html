<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask — Desk · upload</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background:#fff; overflow:hidden; }

    /* ── Step UI ── */
    #ui {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
    }

    /* Step 1: upload screen */
    #step-upload {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      pointer-events: all;
      background: #fff;
    }
    #step-upload h2 { font-size: clamp(32px,6vw,72px); font-weight:300; letter-spacing:-.01em; }
    #step-upload p  { font-size:13px; color:#888; line-height:1.7; text-align:center; max-width:360px; }

    .btn-primary {
      font-size: 11px;
      letter-spacing: .1em;
      color: #111;
      border: 1px solid #111;
      padding: 10px 28px;
      cursor: pointer;
      background: #fff;
      transition: background 200ms, color 200ms;
    }
    .btn-primary:hover { background:#111; color:#fff; }

    #file-input { display:none; }

    /* Step 2: viewpoint */
    #step-viewpoint {
      display: none;
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: all;
    }
    #step-viewpoint p { font-size:11px; color:#888; letter-spacing:.06em; margin-bottom:16px; }

    /* Step 3: point mode */
    #step-points {
      display: none;
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: all;
    }
    #step-points p { font-size:11px; color:#888; letter-spacing:.06em; margin-bottom:16px; }

    /* Metadata form */
    #meta-form {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      background: #fff;
      border: 1px solid #111;
      padding: 32px;
      width: 320px;
      pointer-events: all;
    }
    #meta-form h3 { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:#888; margin-bottom:20px; }
    .field { margin-bottom:16px; }
    .field label { display:block; font-size:9px; letter-spacing:.1em; text-transform:uppercase; color:#bbb; margin-bottom:6px; }
    .field input, .field textarea {
      width:100%; border:none; border-bottom:1px solid #e0e0e0;
      font:inherit; font-size:13px; padding:4px 0; outline:none;
      background:transparent; color:#111;
    }
    .field textarea { resize:none; height:72px; }
    .form-row { display:flex; gap:12px; margin-top:20px; }

    /* Submit screen */
    #step-submit {
      display: none;
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      pointer-events: all;
    }
    #step-submit p { font-size:11px; color:#888; letter-spacing:.06em; margin-bottom:16px; }

    /* Nav */
    #editor-nav {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 20px 28px;
      font-size: 11px;
      letter-spacing: .06em;
      color: #888;
      pointer-events: all;
      z-index: 10;
    }

    /* Step indicator */
    #step-indicator {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: .12em;
      color: #bbb;
      pointer-events: none;
    }

    /* Crosshair for point placement */
    #crosshair {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 20px; height: 20px;
      pointer-events: none;
    }
    #crosshair::before, #crosshair::after {
      content:''; position:absolute; background:#fff;
    }
    #crosshair::before { width:1px; height:100%; left:50%; }
    #crosshair::after  { width:100%; height:1px; top:50%; }
  </style>
</head>
<body>

<div id="ui">
  <nav id="editor-nav">
    <a href="index.html">home</a>
    <span id="step-indicator"></span>
    <span></span>
  </nav>

  <!-- Step 1 -->
  <div id="step-upload">
    <h2>Ask — Desk</h2>
    <p>당신의 책상을 업로드하세요.<br>3D 스캔 파일(GLB)이 필요합니다.</p>
    <button class="btn-primary" id="btn-google-login">Google로 로그인</button>
    <div id="login-status" style="font-size:11px;color:#888;display:none;">
      <span id="login-name"></span> &nbsp;·&nbsp;
      <button id="btn-select-file" class="btn-primary" style="display:inline-block;">GLB 파일 선택</button>
    </div>
    <input type="file" id="file-input" accept=".glb">
    <div id="upload-progress" style="font-size:11px;color:#888;display:none;">업로드 중…</div>
  </div>

  <!-- Step 2 -->
  <div id="step-viewpoint">
    <p>마우스로 원하는 시점을 잡은 뒤<br>저장하세요.</p>
    <button class="btn-primary" id="btn-save-viewpoint">이 시점으로 저장</button>
  </div>

  <!-- Step 3 -->
  <div id="step-points">
    <p>사물을 클릭해 포인트를 지정하세요.<br>완료되면 제출합니다.</p>
    <div style="display:flex;gap:12px;">
      <button class="btn-primary" id="btn-done-points">제출하기</button>
    </div>
  </div>

  <!-- Metadata form -->
  <div id="meta-form">
    <h3>사물 정보</h3>
    <div class="field">
      <label>이름</label>
      <input type="text" id="f-name" placeholder="아날로그 시계">
    </div>
    <div class="field">
      <label>수집일</label>
      <input type="date" id="f-date">
    </div>
    <div class="field">
      <label>기억 메모</label>
      <textarea id="f-memo" placeholder="이 사물에서 떠오르는 기억…"></textarea>
    </div>
    <div class="form-row">
      <button class="btn-primary" id="btn-meta-cancel" style="flex:1;">취소</button>
      <button class="btn-primary" id="btn-meta-save" style="flex:1;">저장</button>
    </div>
  </div>

  <!-- Step submit -->
  <div id="step-submit">
    <p id="submit-status"></p>
    <button class="btn-primary" id="btn-submit">Sheets에 제출</button>
  </div>

  <div id="crosshair"></div>
</div>

<!-- Three.js canvas is appended by editor.js -->
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="js/config.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
